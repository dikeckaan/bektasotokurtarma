# GitHub'a her push'ta siteyi uretip Cloudflare Workers'a yayinlar.
#
# Tek seferlik kurulum:
#   1. Cloudflare panelinde API token olustur:
#      My Profile > API Tokens > Create Token > "Edit Cloudflare Workers" sablonu
#   2. GitHub deposunda: Settings > Secrets and variables > Actions > New repository secret
#      Ad: CLOUDFLARE_API_TOKEN   Deger: olusturdugun token
#   3. Ayni yere ikinci secret: CLOUDFLARE_ACCOUNT_ID (Cloudflare panelinde sag sutunda)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bagimliliklar
        run: npm ci

      - name: Siteyi uret
        run: npm run build

      # build.mjs SEO kontrollerinde sorun bulursa exit 1 verir ve deploy durur.

      - name: Cloudflare Workers'a yayinla
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
