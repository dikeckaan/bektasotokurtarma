# Asıl yayın: her push'ta siteyi üretip Cloudflare Workers'a gönderir.
# Hedef: https://cekici.online
#
# Tek seferlik kurulum — GitHub deposunda
# Settings > Secrets and variables > Actions > New repository secret:
#   CLOUDFLARE_API_TOKEN   Cloudflare > My Profile > API Tokens >
#                          "Edit Cloudflare Workers" şablonu
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare panelinde sağ sütunda yazar
#
# Secret'lar eklenene kadar bu iş atlanır, deponun geri kalanı çalışmaya devam eder.

name: Cloudflare deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Site üretimi hiçbir pakete bağlı değil — sadece Node.
      # build.mjs SEO kontrollerinde sorun bulursa exit 1 verir ve deploy durur.
      - name: Testler
        run: npm test

      - name: Siteyi üret
        run: node build.mjs

      # secrets bağlamı adım seviyesindeki if içinde kullanılamıyor;
      # değeri önce env'e alıp kabuk içinde kontrol ediyoruz.
      - name: Secret kontrolü
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN tanımlı değil, Cloudflare deploy atlandı."
          fi

      - name: Cloudflare Workers'a yayınla
        if: steps.secrets.outputs.hazir == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action varsayılanı 3.90 — o sürüm wrangler.jsonc okumuyor
          # ve "Missing entry-point" hatası veriyor. Sürümü açıkça sabitliyoruz.
          wranglerVersion: "4.127.1"
