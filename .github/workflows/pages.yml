# Önizleme yayını: her push'ta siteyi GitHub Pages'e gönderir.
#
# Adres sabit yazılmıyor: configure-pages adımı hesabın gerçek Pages
# yapılandırmasını (özel alan adı dahil) okuyup origin ve base_path
# değerlerini veriyor, build de onları kullanıyor.
#
# Pages alt dizinde servis ettiği için BASE_PATH ile tüm kök-göreli
# bağlar öneklenir. NOINDEX=1 çünkü asıl site cekici.online — aynı
# içeriğin iki adreste indekslenmesi ikisini de zayıflatır.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pages yapılandırmasını oku
        id: pages
        uses: actions/configure-pages@v5

      - name: Testler
        run: npm test

      - name: Siteyi üret (alt dizin + noindex)
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          NOINDEX: "1"
        run: node build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
